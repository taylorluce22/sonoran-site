<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agency OS — Sonoran Clinical Partners</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agency OS">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Agency OS">
<link rel="icon" type="image/png" sizes="512x512" href="/os-icon.png">
<link rel="apple-touch-icon" href="/os-icon.png">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #070e10; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  /* Fallback shown behind the OS if it can't load (wrong Google account) */
  #fallback {
    position: fixed; inset: 0; z-index: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; padding: 32px; text-align: center;
    font: 400 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #6f7d78; letter-spacing: 0.04em;
  }
  #fallback strong {
    display: block; color: #faf9f6; font-size: 15px;
    letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500;
  }
  #fallback a {
    color: #d9a04a; text-decoration: none;
    border: 1px solid rgba(217,160,74,0.4);
    padding: 10px 18px; border-radius: 4px;
    letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px;
  }
  #fallback a:hover { background: rgba(217,160,74,0.1); }
  /* The full Agency OS, edge to edge */
  #app {
    position: fixed; inset: 0; z-index: 1;
    width: 100%; height: 100%;
    border: 0; background: #070e10;
  }
  /* Mask over the OS's own bottom-right TALK button so there's ONE voice control */
  #bezel {
    position: fixed; right: 0; bottom: 0; z-index: 2;
    width: 208px; height: 104px;
    background: #070e10;
    pointer-events: none;
  }
  /* The ElevenLabs voice agent manages its own fixed bottom-right float (mic works on this real domain) */
  /* One-time "turn on alerts" pill (hidden once you've allowed notifications) */
  #alerts-btn {
    display: none; position: fixed; left: 20px; bottom: 20px; z-index: 2147482000;
    align-items: center; gap: 8px;
    background: #204a38; color: #f2eee4; border: 1px solid rgba(217,160,74,.55);
    border-radius: 999px; padding: 10px 15px; cursor: pointer;
    font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em;
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  #alerts-btn:hover { border-color: #d9a04a; }
</style>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function (OneSignal) {
    await OneSignal.init({
      appId: "bd99046b-e86e-4ac7-b3c9-faf38bd2ae20",
      serviceWorkerParam: { scope: "/os/" },
      serviceWorkerPath: "os/sw.js"
    });
    window.__OneSignal = OneSignal;
    function syncAlertsBtn() {
      var granted = false;
      try { granted = OneSignal.Notifications.permission === true; } catch (e) {}
      var b = document.getElementById('alerts-btn');
      if (b) b.style.display = granted ? 'none' : 'flex';
    }
    syncAlertsBtn();
    try { OneSignal.Notifications.addEventListener('permissionChange', syncAlertsBtn); } catch (e) {}
  });
  function scpEnableAlerts() {
    var O = window.__OneSignal;
    if (!O) return;
    try { O.Notifications.requestPermission(); } catch (e) {}
  }
</script>
</head>
<body>
  <div id="fallback">
    <strong>Agency OS</strong>
    <div>
      If your mission control doesn't load, you're signed into the wrong Google account.<br>
      Sign in as taylor@sonoranclinicalpartners.com, then reload. The voice desk still works either way.
    </div>
    <a href="https://script.google.com/a/macros/sonoranclinicalpartners.com/s/AKfycbwrN5Oc3PU-DtFIO96Kz0X7V_j3yAwOdvPSbZu2HaQJiWhpuIKwyvGeEQWioIz0MIXWPg/exec" target="_blank" rel="noopener">Open OS directly &#8599;</a>
  </div>

  <iframe id="app"
    title="Agency OS"
    src="https://script.google.com/a/macros/sonoranclinicalpartners.com/s/AKfycbwrN5Oc3PU-DtFIO96Kz0X7V_j3yAwOdvPSbZu2HaQJiWhpuIKwyvGeEQWioIz0MIXWPg/exec"
    allow="clipboard-write"></iframe>

  <div id="bezel"></div>

  <button id="alerts-btn" type="button" onclick="scpEnableAlerts()">&#128276;&nbsp;Turn on appointment alerts</button>

  <!-- Voice agent — lives on the real domain so the microphone works -->
  <elevenlabs-convai agent-id="agent_4501kzprvxj3f9zr8es71qpze4sc"></elevenlabs-convai>
  <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
</body>
</html>
